# Layer this on top of docker-compose.yml to run Ollama in Docker as well.
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434

volumes:
  ollama-data: