server:
  port: 8080

spring:
  application:
    name: pr-agent-backend
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # 1.5b instead of 7b ? fits tight local disk space (~1GB vs ~4.7GB).
          # Quality is lower than 7b for complex diffs; revisit if space frees up
          # or when switching to a cloud provider becomes worthwhile.
          model: ${OLLAMA_MODEL:qwen2.5-coder:1.5b}
          temperature: 0.2
    retry:
      max-attempts: 2

github:
  token: ${GITHUB_TOKEN:}

pragent:
  labels:
    enabled: true
  llm:
    provider: ${LLM_PROVIDER:ollama}   # ollama | gemini | groq | openrouter | custom
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:}         # optional, preset used if empty
    model: ${LLM_MODEL:}               # optional, preset used if empty
  retry:
    max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
    max-wait-seconds: ${LLM_RETRY_MAX_WAIT_SECONDS:20}
  fallback: # optional second provider; off while provider is empty
    provider: ${LLM_FALLBACK_PROVIDER:}
    api-key: ${LLM_FALLBACK_API_KEY:}
    base-url: ${LLM_FALLBACK_BASE_URL:}
    model: ${LLM_FALLBACK_MODEL:}
