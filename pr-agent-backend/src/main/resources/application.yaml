server:
  port: 8080

spring:
  application:
    name: pr-agent-backend
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # 1.5b instead of 7b ? fits tight local disk space (~1GB vs ~4.7GB).
          # Quality is lower than 7b for complex diffs; revisit if space frees up
          # or when switching to a cloud provider becomes worthwhile.
          model: ${OLLAMA_MODEL:qwen2.5-coder:1.5b}
