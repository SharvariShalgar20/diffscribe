name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # if one project fails, still see the other's result
      matrix:
        project: [cli, pr-agent-backend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify = compile + tests + package, so a broken pom or a failing
      # shade/repackage step is caught as well, not just failing tests.
      - run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose files
        env:
          GITHUB_TOKEN: dummy-for-validation
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.ollama.yml config -q

      - name: Build the backend image
        run: docker build -t diffscribe-backend pr-agent-backend