name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release and upload files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Same checks as CI: a release never ships jars whose tests fail.
      - name: Build and test both projects
        run: |
          mvn -B verify -f cli/pom.xml
          mvn -B verify -f pr-agent-backend/pom.xml

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir dist
          cp cli/target/pr-agent-cli.jar dist/pr-agent-cli.jar
          backend_jars=(pr-agent-backend/target/pr-agent-backend-*.jar)
          if [ "${#backend_jars[@]}" -ne 1 ]; then
            echo "Expected exactly one backend jar, found: ${backend_jars[*]}"
            exit 1
          fi
          cp "${backend_jars[0]}" dist/pr-agent-backend.jar
          cp cli/install.sh dist/install.sh
          (cd dist && sha256sum pr-agent-cli.jar pr-agent-backend.jar install.sh > SHA256SUMS.txt)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--generate-notes --title "$TAG")
          # A tag with a hyphen (v0.1.0-rc1) is published as a pre-release.
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${flags[@]}"